# =====================================================================
#  Raman microscope control panel — configuration
#
#  Everything starts in SIMULATION. Switch each instrument to
#  "simulate = false" one at a time, once it has been configured and
#  tested (see README.md).
#
#  This file is shared through git. Put what belongs to one computer
#  only (such as simulate = false on the Raman PC) in config.local.toml
#  next to it: it is applied on top of this file and git ignores it.
# =====================================================================

[general]
data_dir = "C:/Datos_Raman"     # default folder for saved data
simulate_all = false            # true = everything simulated (same as --sim)
log_file = "raman_control.log"

# ---------------------------------------------------------------------
# Windows and screens
# The control window goes on the main screen and the image and spectrum
# window on another monitor. Devices that Windows sees as screens but
# are not monitors (such as the BNS spatial light modulator) must be
# listed here, or a window can open on them where nobody can see it.
# Any screen whose name contains one of these texts is never used; the
# names appear in the log, on the line starting "Screens:".
# ---------------------------------------------------------------------
[windows]
ignore_screens = ["BNS"]

# ---------------------------------------------------------------------
# 532 nm Raman laser — Laser Quantum gem (smd12 controller), RS-232
# Close the "RemoteApp Laser Control" before connecting: only one
# program at a time can hold the COM port open.
# ---------------------------------------------------------------------
[laser]
simulate = true
port = "COM4"                   # Device Manager → Ports (COM & LPT)
baudrate = 9600                 # gem/smd12 manual: 9600 baud, 8N1, no handshaking
timeout_s = 0.5
eol = "\r"                      # commands end with CR (RETURN); replies end with CR+LF
max_power_mw = 500.0            # HARD software limit. Do not raise above 500.
default_setpoint_mw = 500.0     # setpoint sent on connecting (not if already emitting)
wavelength_nm = 532.0           # nominal; can be calibrated from the panel
poll_interval_s = 1.0

# Command set, checked against the gem with smd12 manual (RS232 serial
# commands). POWER= takes whole mW, as in the manual's example.
[laser.commands]
on = "ON"
off = "OFF"
set_power = "POWER={mw:.0f}"
get_power = "POWER?"
get_laser_temp = "LASTEMP?"
get_psu_temp = "PSUTEMP?"
get_status = "STATUS?"          # the manual says it returns the interlock status
set_power_mode = "CONTROL=POWER"

# ---------------------------------------------------------------------
# Andor CCD (SDK2, e.g. Newton) + Shamrock 500i spectrograph
# Close Andor Solis before connecting.
# ---------------------------------------------------------------------
[spectrometer]
simulate = true
dll_dir = ""                    # empty = Andor Solis DLLs. If that fails, e.g.
                                # "C:/Program Files/Andor SOLIS"
target_temperature_c = -65.0
safe_shutdown_temperature_c = 0.0     # do not switch the CCD off below this
                                      # (Andor: at least -20 °C; 0 °C to be safe)
fan_mode = "full"
read_mode = "random_track"      # "random_track", "multi_track" or "fvb"
tracks = [[67, 72]]             # random_track: [start row, end row] of each track,
                                # numbered as in Solis (from 1, both included).
                                # Adjust them while watching the signal on the CCD;
                                # several tracks are added together.
mt_number = 1                   # multi_track only; copy these three values from
mt_height = 20                  #   Solis: Acquisition Setup → MT Setup
mt_offset = 0
default_exposure_s = 1.0
continuous_exposure_s = 1.0     # continuous measurement (a live preview): its own
continuous_accumulations = 1    #   exposure and accumulations, no auto-exposure
saturation_counts = 65535
poll_interval_s = 1.0
default_center_nm = 574.0       # 600 l/mm grating → Raman from ~9 cm-1
auto_exposure_target = 0.70     # target fraction of saturation
auto_exposure_min_s = 0.01
auto_exposure_max_s = 120.0
auto_exposure_max_test_s = 2.0  # longest exposure used for test shots

# Turret index → description. Check the actual order in Solis.
[spectrometer.grating_labels]
1 = "600 l/mm, blaze 500 nm"

# ---------------------------------------------------------------------
# Microscope camera — Teledyne DALSA Genie Nano (GigE Vision)
# Close Sapera CamExpert before connecting.
# ---------------------------------------------------------------------
[camera]
simulate = true
cti_path = ""                   # 64-bit .cti from the Spinnaker SDK (see README);
                                # empty = search GENICAM_GENTL64_PATH
device_index = 0
exposure_ms = 20.0
gain_db = 0.0
packet_size = 0                 # 0 = leave as is; 8192 with jumbo frames enabled
pixel_format = ""               # empty = leave as is; e.g. "Mono8" or "Mono12"
display_fps = 25
grab_timeout_s = 1.0

# ---------------------------------------------------------------------
# Simulator parameters (only affect simulation mode)
# ---------------------------------------------------------------------
[simulation]
ccd_cooling_rate_c_per_s = 4.0
ccd_pixels = 1024
span_nm = 86.0
camera_width = 960
camera_height = 720
